<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sky background -->
  <rect width="100" height="100" rx="16" fill="#1e3a5f"/>

  <!-- Ground -->
  <rect x="0" y="78" width="100" height="22" rx="0" fill="#4a3728"/>
  <rect x="0" y="76" width="100" height="4" fill="#f5a623"/>

  <!-- Tower mast (vertical) -->
  <rect x="38" y="18" width="8" height="60" fill="#f5a623"/>

  <!-- Horizontal jib (top arm) -->
  <rect x="20" y="18" width="56" height="6" fill="#f5a623"/>

  <!-- Counter-jib (left short arm) -->
  <rect x="20" y="18" width="20" height="5" fill="#e8941a"/>

  <!-- Jib tip marker -->
  <circle cx="76" cy="21" r="3" fill="#ff4444"/>

  <!-- Tower stripes -->
  <rect x="38" y="24" width="8" height="4" fill="#e8941a" opacity="0.6"/>
  <rect x="38" y="36" width="8" height="4" fill="#e8941a" opacity="0.6"/>
  <rect x="38" y="48" width="8" height="4" fill="#e8941a" opacity="0.6"/>
  <rect x="38" y="60" width="8" height="4" fill="#e8941a" opacity="0.6"/>

  <!-- Cable from jib tip to hook -->
  <line x1="76" y1="24" x2="68" y2="52" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Hook -->
  <path d="M65,52 Q62,58 66,60 Q70,62 71,58" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>

  <!-- Building under construction -->
  <rect x="52" y="58" width="22" height="18" fill="#2a7bb5" opacity="0.85"/>
  <rect x="54" y="60" width="6" height="6" fill="#87ceeb" opacity="0.7"/>
  <rect x="66" y="60" width="6" height="6" fill="#87ceeb" opacity="0.7"/>
  <rect x="54" y="70" width="6" height="6" fill="#87ceeb" opacity="0.7"/>
  <rect x="66" y="70" width="6" height="6" fill="#87ceeb" opacity="0.7"/>

  <!-- Hard hat on top of building -->
  <ellipse cx="63" cy="57" rx="9" ry="3" fill="#f5a623"/>
  <rect x="56" y="54" width="14" height="3" rx="3" fill="#f5a623"/>

  <!-- Safety stripes on ground -->
  <rect x="10" y="76" width="8" height="4" fill="#1e3a5f"/>
  <rect x="26" y="76" width="8" height="4" fill="#1e3a5f"/>
</svg>
